<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Bhed Translator & Dictionary - Translate - Warren Woodhouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* tailwind slate-900 */
            color: #f8fafc; /* tailwind slate-50 */
        }
        h1, h2, h3, .tab-btn {
            font-family: 'Cinzel', serif;
        }
        
        /* Custom Scrollbar for textareas and dictionary list */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        .tab-btn.active {
            border-bottom: 2px solid #38bdf8; /* sky-400 */
            color: #38bdf8;
        }
        
        /* Glowing focus effect for inputs */
        .input-glow:focus {
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            border-color: #38bdf8;
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center">

    <div class="max-w-4xl w-full bg-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-700">
        <!-- Header -->
        <div class="bg-slate-900 px-6 py-8 text-center border-b border-slate-700 relative overflow-hidden">
            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-sky-500 via-slate-900 to-slate-900"></div>
            <h1 class="text-4xl md:text-5xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-500 relative z-10">Al Bhed Translator</h1>
            <p class="text-slate-400 mt-2 text-sm md:text-base relative z-10">Real-time Spiron cipher and comprehensive dictionary</p>
            <p class="text-slate-400 mt-2 text-sm md:text-base relative z-10">Created by <a href="https://warrenwoodhouse.blogspot.com/">Warren Woodhouse</a></p>
        </div>

        <!-- Tab Navigation -->
        <div class="flex border-b border-slate-700 bg-slate-800/50">
            <button id="tab-translator" class="tab-btn active flex-1 py-4 text-lg font-semibold text-slate-300 hover:text-sky-300 transition-colors" onclick="switchTab('translator')">Translator</button>
            <button id="tab-dictionary" class="tab-btn flex-1 py-4 text-lg font-semibold text-slate-300 hover:text-sky-300 transition-colors" onclick="switchTab('dictionary')">Dictionary</button>
        </div>

        <!-- Content Area -->
        <div class="p-6 md:p-8">
            
            <!-- Translator Section -->
            <div id="section-translator" class="space-y-6">
                <div class="flex flex-col md:flex-row gap-6">
                    <!-- English Input -->
                    <div class="flex-1 flex flex-col">
                        <label for="english-input" class="text-sm font-semibold text-sky-400 uppercase tracking-wider mb-2">English</label>
                        <textarea id="english-input" class="input-glow flex-1 min-h-[200px] w-full bg-slate-900 text-slate-100 rounded-lg p-4 resize-none border border-slate-600 transition-all placeholder-slate-500 text-lg leading-relaxed" placeholder="Type English text here..."></textarea>
                    </div>

                    <!-- Swap Icon (Visual only) -->
                    <div class="flex items-center justify-center -my-2 md:my-0 md:-mx-2 z-10">
                        <div class="bg-slate-700 p-3 rounded-full shadow-lg border border-slate-600 text-sky-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 10v12"/><path d="M7 22l-4-4"/><path d="M15 22l4-4"/><path d="M17 14V2"/><path d="M9 14V2"/><path d="M17 2l4 4"/><path d="M9 2L5 6"/></svg>
                        </div>
                    </div>

                    <!-- Al Bhed Input -->
                    <div class="flex-1 flex flex-col">
                        <label for="albhed-input" class="text-sm font-semibold text-sky-400 uppercase tracking-wider mb-2">Al Bhed</label>
                        <textarea id="albhed-input" class="input-glow flex-1 min-h-[200px] w-full bg-slate-900 text-slate-100 rounded-lg p-4 resize-none border border-slate-600 transition-all placeholder-slate-500 text-lg leading-relaxed" placeholder="Doba Ym Phat dacd rany..."></textarea>
                    </div>
                </div>
                <div class="text-sm text-slate-400 text-center">
                    Translations occur in real-time as you type. Punctuation and casing are preserved.
                </div>
            </div>

            <!-- Dictionary Section -->
            <div id="section-dictionary" class="hidden space-y-6">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <input type="text" id="dict-search" class="input-glow block w-full pl-10 pr-3 py-3 border border-slate-600 rounded-lg leading-5 bg-slate-900 text-slate-100 placeholder-slate-500 sm:text-sm transition-all" placeholder="Search dictionary for Al Bhed or English words...">
                </div>

                <div class="bg-slate-900 rounded-lg border border-slate-700 overflow-hidden">
                    <div class="max-h-[60vh] overflow-y-auto">
                        <table class="min-w-full divide-y divide-slate-700">
                            <thead class="bg-slate-800 sticky top-0">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-sky-400 uppercase tracking-wider w-1/2">Al Bhed</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-sky-400 uppercase tracking-wider w-1/2">English</th>
                                </tr>
                            </thead>
                            <tbody id="dict-body" class="bg-slate-900 divide-y divide-slate-800">
                                <!-- Dictionary rows populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Cipher Mappings
        const abToEnMap = {
            'y':'a', 'p':'b', 'l':'c', 't':'d', 'a':'e', 'v':'f', 'k':'g', 'r':'h', 'e':'i', 
            'z':'j', 'g':'k', 'm':'l', 's':'m', 'h':'n', 'u':'o', 'b':'p', 'x':'q', 'n':'r', 
            'c':'s', 'd':'t', 'i':'u', 'j':'v', 'f':'w', 'q':'x', 'o':'y', 'w':'z'
        };

        // Automatically generate English to Al Bhed map by reversing the above
        const enToAbMap = {};
        for (const [ab, en] of Object.entries(abToEnMap)) {
            enToAbMap[en] = ab;
        }

        // Dictionary Data
        const dictionaryData = [
            { ab: "suja", en: "move" },
            { ab: "ed", en: "it" },
            { ab: "kad", en: "get" },
            { ab: "du", en: "to" },
            { ab: "fung", en: "work" },
            { ab: "essateydamo", en: "immediately" },
            { ab: "eh", en: "in" },
            { ab: "dra", en: "the" },
            { ab: "myht", en: "land" },
            { ab: "drana", en: "there" },
            { ab: "pumdc", en: "bolts" },
            { ab: "mekrd", en: "light" },
            { ab: "emmisehyda", en: "illuminate" },
            { ab: "pmylgacd", en: "blackest" },
            { ab: "hekrd", en: "night" },
            { ab: "fedr", en: "with" },
            { ab: "pareht", en: "behind" },
            { ab: "vuindr", en: "fourth" },
            { ab: "bemmyn", en: "pillar" },
            { ab: "oui", en: "you" },
            { ab: "cekrd", en: "sight (could also mean \"see\")" },
            { ab: "muug", en: "look" },
            { ab: "hud", en: "not" },
            { ab: "uh", en: "on" },
            { ab: "mavd", en: "left" },
            { ab: "pid", en: "but" },
            { ab: "nekrd", en: "right" },
            { ab: "ramb", en: "help" },
            { ab: "rambat", en: "helped" },
            { ab: "fynnah", en: "warren" },
            { ab: "ec", en: "al" },
            { ab: "pnit", en: "bhed" },
            { ab: "mbuhyr", en: "spiron" },
            { ab: "ahkmecr", en: "english" },
            { ab: "wanu", en: "zero" },
            { ab: "uha", en: "one" },
            { ab: "dfu", en: "two" },
            { ab: "drnaa", en: "three" },
            { ab: "vuin", en: "four" },
            { ab: "veja", en: "five" },
            { ab: "ceq", en: "six" },
            { ab: "cajah", en: "seven" },
            { ab: "aekrd", en: "eight" },
            { ab: "heha", en: "nine" },
            { ab: "caa", en: "see" }
        ];

        // DOM Elements
        const englishInput = document.getElementById('english-input');
        const albhedInput = document.getElementById('albhed-input');
        const searchInput = document.getElementById('dict-search');
        const dictBody = document.getElementById('dict-body');
        
        let isTranslating = false;

        // Translation Engine Core
        function translateString(text, mapping) {
            return text.split('').map(char => {
                const isUpper = char === char.toUpperCase();
                const lowerChar = char.toLowerCase();
                const translated = mapping[lowerChar];
                
                if (translated) {
                    return isUpper ? translated.toUpperCase() : translated;
                }
                return char; // Return original if not in mapping (e.g., punctuation, spaces, numbers)
            }).join('');
        }

        // Event Listeners for Real-time translation
        englishInput.addEventListener('input', (e) => {
            if (isTranslating) return;
            isTranslating = true;
            albhedInput.value = translateString(e.target.value, enToAbMap);
            isTranslating = false;
        });

        albhedInput.addEventListener('input', (e) => {
            if (isTranslating) return;
            isTranslating = true;
            englishInput.value = translateString(e.target.value, abToEnMap);
            isTranslating = false;
        });

        // Dictionary Rendering
        function renderDictionary(filter = "") {
            const query = filter.toLowerCase();
            const filteredData = dictionaryData.filter(item => 
                item.ab.toLowerCase().includes(query) || 
                item.en.toLowerCase().includes(query)
            );

            dictBody.innerHTML = filteredData.map(item => `
                <tr class="hover:bg-slate-800 transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-100">${item.ab}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-400">${item.en}</td>
                </tr>
            `).join('');

            if (filteredData.length === 0) {
                dictBody.innerHTML = `
                    <tr>
                        <td colspan="2" class="px-6 py-8 text-center text-sm text-slate-500 italic">No entries found matching "${filter}"</td>
                    </tr>
                `;
            }
        }

        // Search Event Listener
        searchInput.addEventListener('input', (e) => {
            renderDictionary(e.target.value);
        });

        // Tab Switching Logic
        function switchTab(tabName) {
            const translatorTab = document.getElementById('tab-translator');
            const dictionaryTab = document.getElementById('tab-dictionary');
            const translatorSection = document.getElementById('section-translator');
            const dictionarySection = document.getElementById('section-dictionary');

            if (tabName === 'translator') {
                translatorTab.classList.add('active');
                dictionaryTab.classList.remove('active');
                translatorSection.classList.remove('hidden');
                dictionarySection.classList.add('hidden');
            } else {
                dictionaryTab.classList.add('active');
                translatorTab.classList.remove('active');
                dictionarySection.classList.remove('hidden');
                translatorSection.classList.add('hidden');
                // Auto-focus search input when opening dictionary
                setTimeout(() => searchInput.focus(), 100);
            }
        }

        // Initialize Dictionary on load
        renderDictionary();
    </script>
</body>
</html>
